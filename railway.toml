[build]
# Force Railway to use npm and bypass workspace completely
buildCommand = "cd artifacts/api-server && npm install --force && npm run build"

[start]
# Start the WhatsApp bot directly
startCommand = "cd artifacts/api-server && node dist/index.mjs"

[deploy]
# Environment variables for Railway
[deploy.variables]
NODE_ENV = "production"
NIXPACKS_NODE_VERSION = "20"
NIXPACKS_PACKAGE_MANAGER = "npm"
NIXPACKS_BUILD_CMD = "cd artifacts/api-server && npm install --force && npm run build"
NIXPACKS_START_CMD = "cd artifacts/api-server && node dist/index.mjs"
NIXPACKS_INSTALL_CMD = "npm install --force"
NIXPACKS_PM = "npm"
NIXPACKS_NO_INSTALL_LOCKFILE = "true"
